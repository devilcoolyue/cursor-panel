[project]
name = "cursor-dashboard"
version = "0.0.8"
description = "查询多个 Cursor 账号的订阅套餐和额度余量（Web 面板 + 命令行）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30",
    "requests>=2.31",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "cryptography>=50.0.1,<51; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography>=46.0.7,<47; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["psutil>=7,<8"]

[project.scripts]
cursor-panel = "cursor_dashboard.server:main"
cursor-quota = "cursor_dashboard.cli:main"
cursor-core = "cursor_dashboard.runtime.cli:entrypoint"
cursor-remote = "cursor_dashboard.runtime.remote:entrypoint"
cursor-api = "cursor_dashboard.runtime.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["cursor_dashboard/web_v2/**"]

[tool.hatch.build.targets.wheel]
packages = ["cursor_dashboard"]
